server:
  port: ${PORT:8000}
  address: 0.0.0.0

spring:
  application:
    name: studyflow-ai-backend
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
  scheduling:
    weight-difficulty: 0.35
    weight-urgency: 0.30
    weight-weakness: 0.20
    weight-importance: 0.15
